<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Série — FirstSeries.io</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-requires-auth="true">

  <header class="site-header">
    <a href="/app.html" class="logo">First<span>Series</span></a>
  </header>

  <main class="detail-page">
    <section class="detail-hero">
      <div class="detail-poster-wrap">
        <img id="serie-affiche" src="" alt="">
      </div>
      <div class="detail-content">
        <div class="detail-badges">
          <span id="serie-type-badge" class="detail-badge">Série</span>
          <span id="serie-meta-badge" class="detail-badge secondary">Chargement...</span>
        </div>
        <h1 id="serie-titre">Chargement...</h1>
        <div class="detail-meta">
          <span id="serie-genres" class="meta-pill"></span>
          <span id="serie-stats" class="meta-pill muted"></span>
        </div>
        <p id="serie-synopsis" class="detail-synopsis"></p>
        <div class="serie-actions">
          <button id="btn-play-premier-episode" class="action-button" type="button">Lire le premier épisode</button>
          <button id="btn-share-serie" class="action-button secondary" type="button">Partager la série</button>
        </div>
      </div>
    </section>

    <section class="detail-section">
      <div class="detail-section-header">
        <h2>Épisodes & saisons</h2>
        <span id="detail-count" class="detail-count">Chargement...</span>
      </div>
      <div class="saisons-tabs" id="saisons-tabs"></div>
      <div class="episodes-list" id="episodes-list"></div>
    </section>
  </main>

  <footer class="site-footer">
    <p>ALPHA | FirstSeries.io | by Le Maxi Phasme</p>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-auth-compat.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/data.js"></script>
  <script src="/js/serie.js"></script>
</body>
</html>
